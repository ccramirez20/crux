packages:
  - "apps/*"
  - "packages/*"

# Pines de seguridad. Unica fuente desde el 2026-08-11: packageManager subio a
# pnpm 10.34.5 y el campo "pnpm" de package.json se borro, que es lo que emitia
# el warning "no longer read by pnpm". Bajo pnpm 9 estos overrides no se leian y
# habia que duplicarlos alla; si alguien vuelve a bajar packageManager a 9, el
# arbol resuelve postcss 8.4.31, sharp 0.34.5 y esbuild 0.18.20, todos con CVE.
#
# Verificado tras el cambio: el lockfile mantiene postcss 8.5.25, sharp 0.35.3 y
# esbuild 0.25.12, y pasan typecheck, 101 tests, lint y el build de produccion.
#
# pnpm 10 ademas no corre scripts de instalacion por defecto y avisa que ignora
# los de esbuild. Se deja asi a proposito: esbuild trae binarios prebuilt por
# plataforma, todo compila y corre sin ese script, y en un repo que fija
# versiones por CVE no se le abre la puerta a scripts que no hacen falta.
overrides:
  postcss: ">=8.5.23"
  sharp: ">=0.35.0"
  esbuild: ">=0.25.0"
  # GHSA-2v37-7h3g-55p8: por debajo de 3.3.18 un generador propio con size 0 se
  # cuelga en un bucle. Entra por postcss, o sea solo en el build, y nada aquí
  # lo llama con un generador propio — pero es un pin de una línea y deja el
  # `pnpm audit` en cero, que es lo que uno quiere poder mirar de un vistazo.
  nanoid: ">=3.3.18"
